 g.save();if(shake>0){g.translate((Math.random()-.5)*shake*24,(Math.random()-.5)*shake*24)}
 sky();fort();ground();
 const L=[{z:0,k:3}];for(const h of hs)L.push({z:h.z,k:0,o:h});for(const o of obs)L.push({z:o.z,k:1+o.t,o});for(const c of cn)L.push({z:c.z,k:4,o:c});
 L.sort((a,b)=>b.z-a.z);
 for(const i of L){if(i.k==3){player();continue}const s=S(i.z);if(i.k==0)house(i.o,s);else if(i.k==1)palm(i.o,s);else if(i.k==2)basket(i.o,s);else coin(i.o,s)}
 g.restore();
 $('sc').textContent=score().toLocaleString('ar-EG');$('cn').textContent='🪙 '+coins.toLocaleString('ar-EG')}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;upd(dt);if(shake>0)shake-=dt;draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key;
 if(st!='run'&&(k=='Enter'||k==' ')){start();e.preventDefault();return}
 if(k=='ArrowLeft'||k=='a')lane=Math.max(-1,lane-1);else if(k=='ArrowRight'||k=='d')lane=Math.min(1,lane+1);
 else if(k=='ArrowUp'||k=='w'||k==' '){jump();e.preventDefault()}});
let p0=null,mv=0;
cv.addEventListener('pointerdown',e=>{p0=[e.clientX,e.clientY];mv=0;try{cv.setPointerCapture(e.pointerId)}catch(_){}});cv.addEventListener('pointermove',e=>{if(!p0)return;const dx=e.clientX-p0[0],dy=e.clientY-p0[1];if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)){lane=Math.max(-1,Math.min(1,lane+(dx>0?1:-1)));p0=[e.clientX,e.clientY];mv=1}else if(dy<-34&&Math.abs(dy)>Math.abs(dx)){jump();p0=[e.clientX,e.clientY];mv=1}});cv.addEventListener('pointercancel',()=>{p0=null});
cv.addEventListener('pointerup',e=>{if(!p0)return;const dx=e.clientX-p0[0],dy=e.clientY-p0[1];p0=null;
 if(!mv&&Math.abs(dx)<12&&Math.abs(dy)<12)jump()});
